<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | Product preview card component</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>

    <main>

    <div class="product-card">

        <picture class="product-card__image">
    
         <source media="(max-width: 768px)" srcset="assets/images/image-product-mobile.jpg">
    
         <img src="assets/images/image-product-desktop.jpg" alt="Product image">

        </picture>

        <section class="product-card_content">

            <span class="product-card__name">PERFUME</span>
            <h1 class="product-card__company">Gabrielle Essence Eau De Parfum</h1>
            <p class="product-card__description">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>

            <div class="product-card__price">
                <span class="product-card__price--new">$149.99</span>
                <span class="product-card__price--old"><s>$169.99</s></span>
            </div>

            <button class="product-card__button">
                <img src="assets/images/icon-cart.svg" alt="Cart icon">
                Add to Cart
            </button>

        </section>

    </div>

    </main>

    <footer class="attribution">

        <section class="attribution-left">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
        </section>

        <section class="attribution-right">
    Coded by <a href="https://www.frontendmentor.io/profile/mo-ha-med-9" target="_blank">Mohamed</a>.
        </section>

  </footer>

</body>
</html>
